<div class="filters form-container mb-4">
    <h4>Filter Exercises</h4>
    <form id="filters-form" class="row gy-3 gx-3">
        {% for filter_name, filter_options in filters.items() %}
        <div class="col-md-4">
            <label for="{{ filter_name }}" class="form-label">
                {{ filter_name.replace('_', ' ').capitalize() }}
            </label>
            <select id="{{ filter_name }}" name="{{ filter_name }}" class="form-select">
                <option value="">All</option>
                {% for option in filter_options %}
                <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        {% endfor %}
    </form>

    <!-- Additional Static Filters -->
    <div class="col-md-4">
        <label for="target_muscles" class="form-label">Target Muscles</label>
        <select id="target_muscles" name="target_muscles" class="form-select">
            <option value="">All</option>
            <!-- Dynamically populated or prefilled options -->
            {% for option in target_muscles_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="utility" class="form-label">Utility</label>
        <select id="utility" name="utility" class="form-select">
            <option value="">All</option>
            {% for option in utility_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="grips" class="form-label">Grips</label>
        <select id="grips" name="grips" class="form-select">
            <option value="">All</option>
            {% for option in grips_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="stabilizers" class="form-label">Stabilizers</label>
        <select id="stabilizers" name="stabilizers" class="form-select">
            <option value="">All</option>
            {% for option in stabilizers_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="synergists" class="form-label">Synergists</label>
        <select id="synergists" name="synergists" class="form-select">
            <option value="">All</option>
            {% for option in synergists_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Filter Button -->
    <div class="mt-3">
        <button type="button" class="btn btn-primary" onclick="filterExercises()">
            Apply Filters
        </button>
    </div>
</div>
